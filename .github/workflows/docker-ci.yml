name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Write a minimal .env required by env_file: .env in docker-compose.yml ─
      # AUTH_PASSWORD_HASH is NOT set here — it's injected via docker-compose.ci.yml
      # environment section using $$ escaping to avoid docker-compose $VAR expansion.
      - name: Write .env
        run: |
          {
            echo "SECRET_KEY=ci-only-secret-key-not-for-production"
            echo "SQLITE_PATH=/app/data/homelab.db"
            echo 'CORS_ORIGINS=["http://localhost:3000"]'
            echo 'SCANNER_RANGES=["127.0.0.1/32"]'
            echo "STATUS_CHECKER_INTERVAL=300"
            echo "MCP_API_KEY=ci-mcp-key"
            echo "MCP_SERVICE_KEY=ci-svc-key"
          } > .env

      # ── Build + start backend and frontend (skip mcp) ─────────────────────────
      # docker-compose.ci.yml: exposes port 8000 + injects AUTH_* env vars
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build backend frontend

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d backend frontend

      # ── Wait for backend to be healthy (max 60 s) ─────────────────────────────
      - name: Wait for backend health
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend
          exit 1

      # ── Smoke: frontend serves HTML ───────────────────────────────────────────
      - name: Smoke — frontend returns 200
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:3000/)
          [ "$STATUS" = "200" ] || { echo "Frontend returned $STATUS"; exit 1; }

      # ── Smoke: nginx proxies the API to the default upstream (backend:8000) ───
      - name: Smoke — frontend proxies /api to the backend
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health)
          [ "$STATUS" = "200" ] || { echo "Proxied health returned $STATUS"; exit 1; }

      # ── Smoke: BACKEND_UPSTREAM reaches a backend off the compose network ─────
      # The backend-on-network_mode:host setup (#512): `backend` does not resolve,
      # so the frontend must proxy to the host. Same image, run outside compose.
      - name: Smoke — BACKEND_UPSTREAM overrides the proxy target
        run: |
          IMAGE=$(docker inspect --format '{{.Image}}' \
            "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q frontend)")
          docker run -d --name frontend-upstream \
            --add-host host.docker.internal:host-gateway \
            -e BACKEND_UPSTREAM=host.docker.internal:8000 \
            -p 3001:80 "$IMAGE"
          for i in $(seq 1 15); do
            STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:3001/api/v1/health || true)
            [ "$STATUS" = "200" ] && exit 0
            sleep 1
          done
          echo "Proxied health via BACKEND_UPSTREAM returned $STATUS" >&2
          docker logs frontend-upstream
          exit 1

      # ── Smoke: a user's own conf.d/default.conf is left alone ─────────────────
      # The start-time render must never write over a bind-mounted config: a
      # read-write mount would be clobbered on the host, a :ro one would crash-loop.
      - name: Smoke — a bind-mounted default.conf is served and untouched
        run: |
          IMAGE=$(docker inspect --format '{{.Image}}' \
            "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q frontend)")
          mkdir -p "$RUNNER_TEMP/custom-conf"
          printf 'server {\n    listen 80;\n    server_name _;\n    location / { return 200 "custom"; }\n}\n' \
            > "$RUNNER_TEMP/custom-conf/default.conf"
          BEFORE=$(sha256sum "$RUNNER_TEMP/custom-conf/default.conf")
          docker run -d --name frontend-custom-rw \
            -v "$RUNNER_TEMP/custom-conf/default.conf:/etc/nginx/conf.d/default.conf" \
            -p 3002:80 "$IMAGE"
          docker run -d --name frontend-custom-ro \
            -v "$RUNNER_TEMP/custom-conf/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -p 3003:80 "$IMAGE"
          for port in 3002 3003; do
            BODY=""
            for i in $(seq 1 15); do
              BODY=$(curl -s "http://localhost:$port/" || true)
              [ "$BODY" = "custom" ] && break
              sleep 1
            done
            [ "$BODY" = "custom" ] || { echo "Port $port served '$BODY', not the mounted config" >&2; docker logs frontend-custom-rw; docker logs frontend-custom-ro; exit 1; }
          done
          AFTER=$(sha256sum "$RUNNER_TEMP/custom-conf/default.conf")
          [ "$BEFORE" = "$AFTER" ] || { echo "Mounted default.conf was rewritten" >&2; cat "$RUNNER_TEMP/custom-conf/default.conf"; exit 1; }

      # ── Smoke: read-only container keeps the pre-rendered default config ──────
      # conf.d is not writable, so the entrypoint skips the render; the copy baked
      # at build time (upstream backend:8000) must still proxy the API.
      - name: Smoke — read-only container falls back to the built-in config
        run: |
          FRONTEND=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q frontend)
          IMAGE=$(docker inspect --format '{{.Image}}' "$FRONTEND")
          NETWORK=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$FRONTEND")
          docker run -d --name frontend-readonly --read-only \
            --tmpfs /var/cache/nginx --tmpfs /var/run \
            --network "$NETWORK" -p 3004:80 "$IMAGE"
          for i in $(seq 1 15); do
            STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:3004/api/v1/health || true)
            [ "$STATUS" = "200" ] && exit 0
            sleep 1
          done
          echo "Read-only frontend returned $STATUS" >&2
          docker logs frontend-readonly
          exit 1

      # ── Tier 3: integration tests against the live stack ──────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test deps
        run: pip install --quiet -r backend/requirements.txt

      - name: Run integration tests
        env:
          INTEGRATION_BASE_URL: http://localhost:8000
          INTEGRATION_USERNAME: admin
          INTEGRATION_PASSWORD: admin
        run: |
          cd backend
          pytest tests/test_integration.py -v

      # ── Teardown ──────────────────────────────────────────────────────────────
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Stop stack
        if: always()
        run: |
          docker rm -f frontend-upstream frontend-custom-rw frontend-custom-ro frontend-readonly 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
